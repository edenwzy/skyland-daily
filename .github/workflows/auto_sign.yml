# run main.py
name: Auto Sign

on:
  schedule:
    - cron: '0 0 * * *' # 08:00 Asia/Hong_Kong
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: 3.9
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          pip install cryptography
      - name: Run main.py
        env:
          GitHub_Actions: true
          TOKEN: ${{ secrets.TOKEN }}
          SC3_SENDKEY: ${{ secrets.SC3_SENDKEY }}
          SC3_UID: ${{ secrets.SC3_UID }}
          EXIT_WHEN_FAIL: true
        run: |
          python src/main.py
      - name: Notify WeCom
        if: success()
        env:
          WECHAT_WEBHOOK: ${{ secrets.WECHAT_WEBHOOK }}
        run: |
          python - <<'PY'
          import os
          import requests
          payload = {"msgtype": "text", "text": {"content": "森空岛签到任务执行成功 ✅"}}
          response = requests.post(os.environ["WECHAT_WEBHOOK"], json=payload, timeout=15)
          response.raise_for_status()
          result = response.json()
          if result.get("errcode") != 0:
              raise SystemExit(f"WeCom notification failed: {result}")
          print("WeCom notification sent")
          PY
