# run main.py
name: Auto Sign


on:
  schedule:
    - cron: '0 0 * * *' # 08:00 Asia/Hong_Kong
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: 3.9
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          pip install cryptography
      - name: Run main.py
        env:
          GitHub_Actions: true
          TOKEN: ${{ secrets.TOKEN }}
          SC3_SENDKEY: ${{ secrets.SC3_SENDKEY }}
          SC3_UID: ${{ secrets.SC3_UID }}
          EXIT_WHEN_FAIL: true
        run: |
          set -o pipefail
          python src/main.py 2>&1 | tee sign_result.log
      - name: Notify WeCom
        if: success()
        env:
          WECHAT_WEBHOOK: ${{ secrets.WECHAT_WEBHOOK }}
        run: |
          python - <<'PY'
          import ast
          import os
          from pathlib import Path
          import requests


          log = Path("sign_result.log").read_text(encoding="utf-8", errors="replace")
          details = []
          keywords = ("签到成功", "重复签到", "已经签到", "已签到", "签到失败")
          for line in log.splitlines():
              if " - INFO - " not in line:
                  continue
              message = line.split(" - INFO - ", 1)[1].strip()
              try:
                  parsed = ast.literal_eval(message)
              except (ValueError, SyntaxError):
                  parsed = None
              candidates = parsed if isinstance(parsed, list) else [message]
              for item in candidates:
                  text = str(item)
                  if any(keyword in text for keyword in keywords):
                      details.append(text)


          if not details:
              details.append("签到任务执行成功，但未提取到奖励详情")
          content = ("森空岛签到通知\n" + "\n".join(details))[:2000]
          payload = {"msgtype": "text", "text": {"content": content}}
          response = requests.post(os.environ["WECHAT_WEBHOOK"], json=payload, timeout=15)
          response.raise_for_status()
          result = response.json()
          if result.get("errcode") != 0:
              raise SystemExit(f"WeCom notification failed: {result}")
          print(f"WeCom notification sent: {content}")
          PY

